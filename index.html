<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fatih Usta QR Menü</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column. Logo hero, sticky bar with category chips, compact dish rows (photo slot optional), cart as bottom sheet. Strictly black and white to match the logo. */
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface-2: #1d1d1d;
  --fg: #f6f6f6;
  --muted: #a3a3a3;
  --line: rgba(255, 255, 255, 0.14);
  --line-strong: rgba(255, 255, 255, 0.34);
  --glass: rgba(10, 10, 10, 0.82);
  --font-display: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gut-l: max(18px, env(safe-area-inset-left, 0px));
  --gut-r: max(18px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; padding-bottom: 100px; }
body.lock { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 60; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.logo-img { display: block; width: 100%; height: auto; }

/* splash */
#splash { position: fixed; inset: 0; z-index: 100; background: #000; display: grid; place-items: center; transition: opacity .8s ease, visibility .8s; overflow: hidden; }
#splash.out { opacity: 0; visibility: hidden; }
#splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#splash::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 40% at 50% 55%, rgba(255, 255, 255, .10), transparent 70%); animation: breathe 3s ease-in-out infinite alternate; }
@keyframes breathe { from { opacity: .5; } to { opacity: 1; } }
.splash-in { position: relative; width: min(78vw, 380px); display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; animation: rise 1.4s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
.splash-in .logo-img { filter: drop-shadow(0 0 18px rgba(255, 255, 255, .45)); }
.splash-in p { margin: 0; color: var(--muted); font-family: var(--font-display); font-weight: 300; letter-spacing: .22em; font-size: 12px; text-transform: uppercase; opacity: 0; animation: fadein 1s ease .9s forwards; }
@keyframes fadein { to { opacity: 1; } }

/* hero */
.hero { position: relative; padding: 48px var(--gut-r) 30px var(--gut-l); display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; border-bottom: 1px solid var(--line); background: radial-gradient(ellipse 80% 90% at 50% 0%, #1c1c1c 0%, var(--bg) 70%); }
.hero .logo-img { width: min(84vw, 400px); }
.hero .menu { display: flex; align-items: center; gap: 14px; font-family: var(--font-display); font-weight: 300; font-size: 14px; letter-spacing: .6em; padding-left: .6em; color: var(--fg); }
.hero .menu i { display: block; width: 36px; height: 1px; background: var(--line-strong); }

/* sticky bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 720px; margin: 0 auto; padding: 8px var(--gut-r) 8px var(--gut-l); display: flex; flex-direction: column; gap: 8px; }
.top-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mini { flex: 1; min-width: 0; }
.mini .logo-img { width: 118px; max-width: 100%; }
.cartbtn { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 14px; transition: background .2s, border-color .2s; }
.cartbtn:hover { border-color: #fff; }
.cartbtn svg { width: 20px; height: 20px; }
.badge { min-width: 28px; height: 28px; padding: 0 7px; border-radius: 999px; background: #fff; color: #000; font-size: 14px; font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.bump { animation: bump .5s ease; }
@keyframes bump { 30% { transform: scale(1.14); } 60% { transform: scale(.97); } }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-family: var(--font-display); font-size: 13px; font-weight: 500; letter-spacing: .1em; white-space: nowrap; transition: all .25s; }
.chip.on { background: #fff; border-color: #fff; color: #000; }

/* menu */
main { max-width: 720px; margin: 0 auto; padding: 26px var(--gut-r) 0 var(--gut-l); display: flex; flex-direction: column; gap: 38px; }
section.cat { scroll-margin-top: 112px; }
section.cat h2 { display: flex; align-items: center; gap: 14px; margin: 0 0 4px; font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .14em; }
section.cat h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-strong), transparent); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 14px; padding: 16px 0; border-bottom: 1px solid var(--line); animation: reveal .6s ease both; }
.item.has-ph { grid-template-columns: 88px minmax(0, 1fr) auto; }
@keyframes reveal { from { opacity: .3; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.ph { width: 88px; height: 88px; border-radius: 14px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.08) brightness(.88); }
.tx { min-width: 0; }
.tx h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.25; letter-spacing: .03em; overflow-wrap: anywhere; text-wrap: balance; }
.unit { margin-top: 2px; color: var(--muted); font-size: 14px; font-weight: 500; }
.buy { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.price { font-family: var(--font-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nop { display: inline-block; padding: 3px 10px; border-radius: 999px; border: 1px dashed var(--line-strong); color: var(--muted); font-family: var(--font-body); font-size: 12px; font-weight: 600; white-space: nowrap; }
.add { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #fff; background: #fff; color: #000; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .04em; white-space: nowrap; transition: transform .15s, background .2s, color .2s; }
.add:active { transform: scale(.96); }
.add.ok { background: transparent; color: #fff; }
.ed { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ed label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.ed input { min-width: 0; min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px dashed var(--line-strong); background: var(--surface); color: var(--fg); font: inherit; }
.editbar { border: 1px dashed var(--line-strong); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.editbar p { margin: 0; font-size: 14px; }
.editbar .row { display: flex; flex-wrap: wrap; gap: 8px; }
.editbar input { flex: 1 1 200px; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
.btn2 { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); font-weight: 600; }
.qrout { background: #fff; padding: 12px; border-radius: 12px; width: fit-content; max-width: 100%; }
.qrout svg { display: block; max-width: 100%; height: auto; }
footer { text-align: center; color: var(--muted); font-family: var(--font-display); font-weight: 300; font-size: 13px; letter-spacing: .5em; padding: 40px var(--gut-r) 12px var(--gut-l); }

/* dock, toast, fly */
.dock { position: fixed; z-index: 55; left: 0; right: 0; bottom: 0; padding: 10px var(--gut-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gut-l); pointer-events: none; transform: translateY(120%); transition: transform .4s ease; }
.dock.on { transform: none; }
.dock button { pointer-events: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 560px; margin: 0 auto; min-height: 58px; padding: 0 20px; border-radius: 18px; border: 0; background: #fff; color: #000; font-family: var(--font-display); font-weight: 600; box-shadow: 0 10px 34px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .5); }
.dock .t { font-size: 20px; font-variant-numeric: tabular-nums; }
.fly { position: fixed; z-index: 120; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 14px rgba(255, 255, 255, .9); pointer-events: none; }
.toast { position: fixed; z-index: 130; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 999px; background: #fff; color: #000; font-size: 14px; font-weight: 600; transition: all .3s; pointer-events: none; text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* cart panel */
.veil { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, .7); opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; }
.veil.on { opacity: 1; visibility: visible; }
.panel { position: fixed; z-index: 80; left: 0; right: 0; bottom: 0; height: 92dvh; max-height: 92vh; display: flex; flex-direction: column; background: #111; border: 1px solid var(--line); border-radius: 24px 24px 0 0; transform: translateY(105%); visibility: hidden; transition: transform .4s cubic-bezier(.2, .8, .2, 1), visibility .4s; }
.panel.on { transform: none; visibility: visible; }
@media (min-width: 760px) { .panel { left: auto; top: 0; height: 100dvh; max-height: none; width: 440px; border-radius: 24px 0 0 24px; transform: translateX(105%); } .panel.on { transform: none; } }
.ph-head { display: flex; align-items: center; gap: 10px; padding: 16px var(--gut-r) 12px var(--gut-l); border-bottom: 1px solid var(--line); }
.ph-head h2 { margin: 0; flex: 1; font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .1em; }
.iconbtn { min-width: 44px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--fg); display: inline-grid; place-items: center; padding: 0 12px; font-size: 14px; font-weight: 600; }
.iconbtn svg { width: 20px; height: 20px; }
.pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 8px var(--gut-r) 8px var(--gut-l); }
.line { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.line.has-th { grid-template-columns: 60px minmax(0, 1fr); gap: 10px 12px; }
.line .th { width: 60px; height: 60px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.line .th img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1); }
.line h4 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.25; letter-spacing: .03em; overflow-wrap: anywhere; }
.line .sub { color: var(--muted); font-size: 13px; }
.line .ctl { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; }
.qty button { width: 46px; height: 46px; border: 0; background: var(--surface-2); font-size: 22px; }
.qty output { min-width: 40px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.ltot { margin-left: auto; font-family: var(--font-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.rm { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); display: grid; place-items: center; }
.rm svg { width: 18px; height: 18px; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; height: 100%; min-height: 260px; padding: 20px; }
.empty svg { width: 60px; height: 60px; color: var(--muted); }
.empty h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 24px; }
.pfoot { padding: 14px var(--gut-r) calc(14px + env(safe-area-inset-bottom, 0px)) var(--gut-l); border-top: 1px solid var(--line); background: #0c0c0c; display: flex; flex-direction: column; gap: 8px; }
.sum { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 15px; }
.sum b { color: var(--fg); font-variant-numeric: tabular-nums; }
.sum.big { color: var(--fg); font-family: var(--font-display); font-size: 24px; font-weight: 600; }
.note { font-size: 13px; color: var(--muted); }
.cta { min-height: 56px; padding: 0 24px; border-radius: 16px; border: 0; background: #fff; color: #000; font-family: var(--font-display); font-weight: 600; letter-spacing: .14em; }
.field { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; }
.field label { font-weight: 600; }
.field input { min-height: 54px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font: inherit; font-size: 20px; }
.field .err { color: #fff; font-size: 13px; min-height: 18px; }
.done { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 40px 8px; }
.done svg { width: 72px; height: 72px; }
.done h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 26px; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<script>
/* ============================================================
   MENÜ VERİSİ — fiyatları (price) ve gramajları (unit) buradan değiştirin.
   price: null = henüz girilmedi. Fotoğraf eklemek için öğeye img: 'data:image/jpeg;base64,...' yazın
   (sayfa dışarıdan resim yüklemez, fotoğraflar dosyanın içine gömülmelidir).
   ============================================================ */
const MENU = [

    { id: 'zirhta-urfa-durum', name: 'ZIRHTA URFA DÜRÜM', unit: '200 gr', price: 350 }
  ]},

    { id: 'kuzu-kaburga', name: 'KUZU KABURGA', unit: '250 gr', price: 650 },
    { id: 'tavuk-kanat', name: 'TAVUK KANAT', unit: '7 adet', price: 400 },
    { id: 'kuslama', name: 'KÜŞLEME', unit: '220 gr', price: 780 },
    { id: 'fatih-tava-1', name: 'FATİH TAVA TEK KİŞİLİK', unit: '', price: 600 },
    { id: 'fatih-tava-2', name: 'FATİH TAVA İKİ KİŞİLİK', unit: '', price: 1200 },
    { id: 'boru-2', name: 'BORU KEBABI İKİ KİŞİLİK', unit: '', price: 1500 },

];

        '</div></div><div class="pfoot"><button class="cta" type="button" data-act="close">MENÜYE DÖN</button></div>';
    } else if (view === 'checkout') {
      h = '<div class="ph-head"><button class="iconbtn" type="button" data-act="back" aria-label="Sepete dön" data-focus>←</button><h2>SİPARİŞ ONAYI</h2><button class="iconbtn" type="button" data-act="close" aria-label="Kapat">' + ICON_X + '</button></div><div class="pbody">';
      t.lines.forEach(function (l) {
        h += '<div class="sum" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>' + esc(l.it.name) + ' × ' + l.qty + '</span><b>' + (l.line === null ? 'Fiyat girilecek' : fmt(l.line)) + '</b></div>';
      });
      h += '<div class="field"><label for="tableNo">Masa numarası</label><input id="tableNo" inputmode="numeric" autocomplete="off" placeholder="örn. 12" value="' + esc(lastTable) + '"><div class="err" id="tableErr" aria-live="polite"></div></div></div>' +
        '<div class="pfoot"><div class="sum"><span>Toplam porsiyon</span><b>' + t.count + '</b></div><div class="sum big"><span>Toplam</span><b>' + fmt(t.total) + '</b></div>' +
        (t.unpriced ? '<div class="note">Bazı ürünlerin fiyatı henüz girilmedi, toplama dahil değil.</div>' : '') +
        '<button class="cta" type="button" data-act="confirm">SİPARİŞİ ONAYLA</button></div>';
    } else {
      h = '<div class="ph-head"><h2>SEPET</h2>' + (t.count ? '<button class="iconbtn" type="button" data-act="clear">Temizle</button>' : '') + '<button class="iconbtn" type="button" data-act="close" aria-label="Kapat" data-focus>' + ICON_X + '</button></div><div class="pbody">';
      if (!t.count) {
        h += '<div class="empty">' + ICON_BAG + '<h3>Sepetiniz Henüz Boş</h3><button class="cta" type="button" data-act="close">MENÜYE DÖN</button></div>';
      } else {
        t.lines.forEach(function (l) {
          h += '<div class="line' + (l.it.img ? ' has-th' : '') + '">' + (l.it.img ? '<div class="th"><img src="' + esc(l.it.img) + '" alt=""></div>' : '') +
            '<div><h4>' + esc(l.it.name) + '</h4><div class="sub">' + esc(unitOf(l.it)) + (unitOf(l.it) ? ' · ' : '') + (l.price === null ? 'Fiyat girilecek' : fmt(l.price) + ' / porsiyon') + '</div></div>' +
            '<div class="ctl"><div class="qty"><button type="button" data-act="dec" data-id="' + l.it.id + '" aria-label="Azalt">−</button><output aria-live="polite">' + l.qty + '</output><button type="button" data-act="inc" data-id="' + l.it.id + '" aria-label="Arttır">+</button></div>' +
            '<button class="rm" type="button" data-act="rm" data-id="' + l.it.id + '" aria-label="' + esc(l.it.name) + ' ürününü sil">' + ICON_TRASH + '</button><span class="ltot">' + (l.line === null ? '—' : fmt(l.line)) + '</span></div></div>';
        });
      }
      h += '</div>';
      if (t.count) {
        h += '<div class="pfoot"><div class="sum"><span>Seçilen ürün</span><b>' + t.count + '</b></div><div class="sum"><span>Ara Toplam</span><b>' + fmt(t.total) + '</b></div><div class="sum big"><span>Toplam</span><b>' + fmt(t.total) + '</b></div>' +
          (t.unpriced ? '<div class="note">Bazı ürünlerin fiyatı henüz girilmedi, toplama dahil değil.</div>' : '') +
          '<button class="cta" type="button" data-act="checkout">SİPARİŞİ TAMAMLA</button></div>';
      }
    }
    var keepScroll = $('.pbody', p) ? $('.pbody', p).scrollTop : 0;
    p.innerHTML = h;
    if ($('.pbody', p)) $('.pbody', p).scrollTop = keepScroll;
  }

  function submitOrder() {
    var t = totals();
    var order = { table: lastTable, createdAt: new Date().toISOString(), total: t.total, items: t.lines.map(function (l) { return { id: l.it.id, name: l.it.name, unit: unitOf(l.it), qty: l.qty, price: l.price }; }) };
    if (ORDER_ENDPOINT) { try { fetch(ORDER_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(order) }); } catch (e) {} }
    return order;
  }

  function exportJson() {
    var out = {};
    Object.keys(ITEMS).forEach(function (id) { out[id] = { price: priceOf(ITEMS[id]), unit: unitOf(ITEMS[id]) }; });
    var txt = JSON.stringify(out, null, 2);
    function fallback() { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('JSON kopyalandı'); } catch (e) { toast('Kopyalanamadı'); } ta.remove(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('JSON kopyalandı'); }, fallback); else fallback();
  }
  function makeQr() {
    var url = $('#qrUrl').value.trim(), out = $('#qrOut');
    if (!url) { out.textContent = 'Önce bir adres yazın.'; return; }
    if (typeof qrcode !== 'function') { out.textContent = 'QR kütüphanesi yüklenemedi.'; return; }
    var qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    out.innerHTML = '<div class="qrout">' + qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) + '</div>';
  }

  document.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (chip) { var sec = $('#cat-' + chip.dataset.cat); if (sec) { sec.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); setActive(chip.dataset.cat); buzz(8); } return; }
    if (e.target.closest('#cartBtn') || e.target.closest('#dockBtn')) { openCart('cart'); return; }
    if (e.target.id === 'veil') { closeCart(); return; }
    var a = e.target.closest('[data-act]'); if (!a) return;
    var act = a.dataset.act, id = a.dataset.id;
    if (act === 'add') add(id, a);
    else if (act === 'inc') setQty(id, (cart[id] || 0) + 1);
    else if (act === 'dec') setQty(id, (cart[id] || 0) - 1);
    else if (act === 'rm') setQty(id, 0);
    else if (act === 'clear') { cart = {}; changed(); }
    else if (act === 'close') closeCart();
    else if (act === 'checkout') { view = 'checkout'; renderCart(); }
    else if (act === 'back') { view = 'cart'; renderCart(); }
    else if (act === 'confirm') {
      var v = ($('#tableNo').value || '').trim();
      if (!v) { $('#tableErr').textContent = 'Lütfen masa numaranızı girin.'; $('#tableNo').focus(); return; }
      lastTable = v; submitOrder(); cart = {}; save(); view = 'done'; badges(); renderCart(); buzz([20, 40, 20]);
    }
    else if (act === 'export') exportJson();
    else if (act === 'qr') makeQr();
  });
  document.addEventListener('change', function (e) {
    var el = e.target; if (!el.dataset || !el.dataset.ed) return;
    var id = el.dataset.id; over[id] = over[id] || {};
    if (el.dataset.ed === 'price') {
      var raw = el.value.replace(',', '.').trim();
      if (raw === '' || isNaN(Number(raw))) { delete over[id].price; if (raw !== '') el.value = ''; } else over[id].price = Number(raw);
    } else { over[id].unit = el.value.trim(); }
    ls.set('fu_over', over);
    var pr = $('[data-pr="' + id + '"]'); if (pr) pr.innerHTML = priceHtml(ITEMS[id]);
    var u = $('[data-un="' + id + '"]'); if (u) { u.textContent = unitOf(ITEMS[id]); u.hidden = !unitOf(ITEMS[id]); }
    badges(); if ($('#panel').classList.contains('on')) renderCart();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('#panel').classList.contains('on')) closeCart();
    if (e.key === 'Enter' && e.target.id === 'tableNo') { var c = $('[data-act="confirm"]'); if (c) c.click(); }
  });
  window.addEventListener('hashchange', function () { var m = location.hash === '#edit'; if (m !== editMode) { editMode = m; renderMenu(); renderEditbar(); spy(); } });

  function splash() {
    var sp = $('#splash');
    if (reduce || ls.get('fu_seen', false)) { sp.remove(); return; }
    ls.set('fu_seen', true);
    sp.hidden = false;
    var cv = $('#sparks'), ctx = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0, ps = [], run = true;
    function size() { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    size();
    function spawn() { return { x: Math.random() * W, y: H + 10, vx: (Math.random() - .5) * .6, vy: -(0.6 + Math.random() * 1.6), r: .7 + Math.random() * 1.8, life: 0, max: 120 + Math.random() * 140 }; }
    for (var i = 0; i < 60; i++) { var p = spawn(); p.y = Math.random() * H; p.life = Math.random() * p.max; ps.push(p); }
    function frame() {
      if (!run) return;
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < ps.length; i++) {
        var p = ps[i]; p.life++; p.x += p.vx + Math.sin(p.life / 18) * .3; p.y += p.vy;
        if (p.life > p.max || p.y < -10) { ps[i] = spawn(); continue; }
        var a = 1 - p.life / p.max;
        ctx.beginPath(); ctx.fillStyle = 'rgba(255,255,255,' + (a * .85) + ')'; ctx.shadowColor = 'rgba(255,255,255,.8)'; ctx.shadowBlur = 8;
        ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    var done = false;
    function end() { if (done) return; done = true; sp.classList.add('out'); setTimeout(function () { run = false; sp.remove(); }, 900); }
    sp.addEventListener('click', end);
    setTimeout(end, 2700);
  }

  renderMenu(); renderEditbar(); badges(); spy(); splash();
})();
</script>

</body></html>
